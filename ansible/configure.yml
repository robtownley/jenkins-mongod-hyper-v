- name: Discover existing replica configuration
  hosts: mongodb
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check required admin credentials
      ansible.builtin.assert:
        that:
          - lookup('env', 'MONGO_ADMIN_USER') | length > 0
          - lookup('env', 'MONGO_ADMIN_PASSWORD') | length >= 16
      no_log: true
    - name: Probe local replica identity without requiring credentials
      ansible.builtin.command:
        argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
      environment:
        LAB_PHASE: probe
      register: probe
      changed_when: false
    - name: Remember replica identity
      ansible.builtin.set_fact:
        replica_initialized: "{{ 'INITIALIZED' in probe.stdout }}"

- name: Bootstrap only an entirely new replica set
  hosts: mongo1
  become: true
  gather_facts: false
  tasks:
    - name: Initiate once, never force-reconfigure an existing set
      ansible.builtin.command:
        argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
      environment:
        LAB_PHASE: initiate
      when: not (hostvars['mongo1'].replica_initialized or hostvars['mongo2'].replica_initialized or hostvars['mongo3'].replica_initialized)
      changed_when: true

- name: Wait for a consistent writable primary across the replica set
  hosts: mongo1
  become: true
  gather_facts: false
  tasks:
    - name: Discover one writable primary with bounded direct member probes
      block:
        - name: Wait for replica election and writable-primary readiness
          ansible.builtin.command:
            argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
          environment:
            LAB_PHASE: discover-primary
          timeout: 420
          register: election
          changed_when: false
      rescue:
        - name: Show the final election probe result
          ansible.builtin.debug:
            msg:
              stdout: "{{ election.stdout | default('No probe output returned') }}"
              stderr: "{{ election.stderr | default('Probe failed before output') }}"
              rc: "{{ election.rc | default('unknown') }}"
        - name: Stop if no stable writable primary was found
          ansible.builtin.fail:
            msg: Election did not become ready. Review the per-member probe results above; no replica configuration was reset.
    - name: Validate elected inventory member
      ansible.builtin.assert:
        that:
          - (election.stdout | from_json).primary_node in groups['mongodb']
    - name: Add the elected writable member to the runtime group
      ansible.builtin.add_host:
        name: "{{ (election.stdout | from_json).primary_node }}"
        groups: elected_primary
    - name: Report elected primary and member readiness
      ansible.builtin.debug:
        msg: "{{ election.stdout | from_json }}"

- name: Create first admin and verify writes
  hosts: elected_primary
  become: true
  gather_facts: false
  environment:
    MONGO_ADMIN_USER: "{{ lookup('env', 'MONGO_ADMIN_USER') }}"
    MONGO_ADMIN_PASSWORD: "{{ lookup('env', 'MONGO_ADMIN_PASSWORD') }}"
    LAB_TOKEN: "{{ lookup('env', 'LAB_TOKEN') }}"
  tasks:
    - name: Ensure initial admin exists without resetting existing passwords
      ansible.builtin.command:
        argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
      environment:
        LAB_PHASE: user
      no_log: true
      register: user_result
      changed_when: "'CREATED' in user_result.stdout"
    - name: Verify topology and acknowledged write on all three members
      ansible.builtin.command:
        argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
      environment:
        LAB_PHASE: write
      register: verify
      until: verify.rc == 0
      retries: 120
      delay: 5
      changed_when: true
      no_log: true

- name: Verify the document locally on each member
  hosts: mongodb
  become: true
  gather_facts: false
  tasks:
    - name: Confirm local replication
      ansible.builtin.command:
        argv: [mongosh, --quiet, --host, 127.0.0.1, --file, /usr/local/lib/mongodb-lab-cluster.js]
      environment:
        LAB_PHASE: read
        MONGO_ADMIN_USER: "{{ lookup('env', 'MONGO_ADMIN_USER') }}"
        MONGO_ADMIN_PASSWORD: "{{ lookup('env', 'MONGO_ADMIN_PASSWORD') }}"
        LAB_TOKEN: "{{ lookup('env', 'LAB_TOKEN') }}"
      register: local_read
      until: local_read.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      no_log: true
